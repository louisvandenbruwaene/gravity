<!doctype html>
<html><head><meta charset="utf-8"><title>Gravity icon</title>
<style>html,body{margin:0;background:transparent}svg{display:block;width:1024px;height:1024px}</style></head>
<body><div id="out"></div>
<script>
/* The Gravity app icon: a macOS-style rounded square (824px tile, 100px margin) drawn as SVG. */
const tile=(bg,inner)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#c)">${bg}${inner}<rect x="100" y="100" width="824" height="824" fill="url(#sh)"/></g></svg>`;
const fill=(c1,c2)=>`<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>`;
const ICON=tile(fill('#1a1b3e','#07071a'),`${Array.from({length:40},(_,i)=>`<circle cx="${120+((i*197)%790)}" cy="${120+((i*331)%790)}" r="${2+i%3}" fill="#dfe6ff" opacity=".7"/>`).join('')}
    <ellipse cx="512" cy="512" rx="330" ry="150" fill="none" stroke="#8fa0ff" stroke-width="8" stroke-dasharray="18 22" transform="rotate(-20 512 512)" opacity=".7"/>
    <circle cx="512" cy="512" r="120" fill="#f4b73c"/><circle cx="480" cy="480" r="120" fill="#fff8d8" opacity=".35"/>
    <circle cx="790" cy="380" r="52" fill="#3f9a57"/><path d="M790 328 V270" stroke="#e6edf5" stroke-width="8"/><path d="M790 270 L830 284 L790 298 Z" fill="#f2c94c"/>
    <path d="M210 700 Q330 560 470 690 T740 640" stroke="#ffc88c" stroke-width="10" fill="none" stroke-dasharray="4 18" stroke-linecap="round"/>
    <g transform="translate(210 700) rotate(-50)"><path d="M40 0 L-24 -22 L-14 0 L-24 22 Z" fill="#f3f5fa"/><path d="M-24 -10 L-56 0 L-24 10 Z" fill="#ffb347"/></g>`);
document.getElementById('out').innerHTML=ICON;
</script></body></html>
