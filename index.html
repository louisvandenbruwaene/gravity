*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one wide star chart, level strip above, planet tray and launch below. Single deep-space look on purpose. */
:root{
  --bg:#0d0e22; --panel:#191b36; --panel2:#24274a; --ink:#e9ecf8; --muted:#9aa3c7; --line:#2f3360;
  --accent:#f2c94c; --good:#8fe3a0; --bad:#ff7d6e;
  --f-display:"Fredoka","Avenir Next Rounded",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 36px;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.back{color:var(--muted);text-decoration:none;font-family:var(--f-display);font-size:14px;width:100%}
.back:hover{color:var(--accent)}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:-.01em}
#lvname{font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--muted)}
.levels{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:var(--f-display);font-size:16px;font-weight:600;border:0;border-radius:10px;padding:9px 14px;background:var(--panel2);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #06060f;transition:transform .06s}
button:hover:not(:disabled){filter:brightness(1.15)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #06060f}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#2a2208;min-width:100px}
.lv{width:44px;padding:5px 0 4px;display:grid;justify-items:center;line-height:1.1}
.lv b{font-size:16px}.lv small{font-size:10px;letter-spacing:1px;color:var(--accent)}
.lv.cur{background:var(--accent);color:#2a2208}.lv.cur small{color:#2a2208}
.stage{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#0b0b1e}
canvas{display:block;width:100%;aspect-ratio:8/5;max-width:100%;touch-action:none;cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tray-label{font-family:var(--f-display);color:var(--muted);font-size:14px;margin-right:4px}
.chip{display:flex;align-items:center;gap:8px;min-height:48px}
.chip i{display:block;border-radius:50%;box-shadow:0 0 0 2px #06060f}
.chip span{font-size:13px;color:var(--muted)}
.chip.sel{box-shadow:0 0 0 3px var(--accent) inset,0 3px 0 #06060f}
.chip.used,.chip:disabled{opacity:.3;cursor:default}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,6,18,.55);padding:16px}
.res{background:var(--panel);border:2px solid var(--line);padding:20px 26px;border-radius:16px;text-align:center;display:grid;gap:12px;min-width:min(320px,100%)}
.res h2{font-family:var(--f-display);font-size:28px;margin:0}
.stars{display:flex;justify-content:center;gap:8px}
.stars span{font-size:44px;line-height:1;color:var(--line)}
.stars span.on{color:var(--accent);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.goals{display:grid;gap:4px;text-align:left;font-variant-numeric:tabular-nums}
.goals div{display:flex;gap:8px}.goals .ok{color:var(--good)}.goals .no{color:var(--muted)}
.res .group{justify-content:center}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.stars span.on{animation:none}}
@media (max-width:560px){h1{font-size:24px}button{font-size:14px;padding:8px 11px}}

function makeWorld(L,placed){
  const S=L.star,bodies=[];
  const orbitAbout=(b,x,y)=>{const R=Math.hypot(x-S.x,y-S.y)||1;Object.assign(b,{cx:S.x,cy:S.y,R,ph:Math.atan2(y-S.y,x-S.x),w:S.dir*S.K/Math.pow(R,1.5)});};
  for(const d of L.bodies){const b=Object.assign({},d);
    if(d.polar){const [R,a]=d.polar;orbitAbout(b,S.x+R*Math.cos(a),S.y+R*Math.sin(a));}
    else if(d.xy)orbitAbout(b,...d.xy);
    bodies.push(b);}
  for(const b of bodies)if(b.moonOf)b.parent=bodies.find(o=>o.id===b.moonOf);
  if(S.r)bodies.push({type:S.hole?'hole':'star',cx:S.x,cy:S.y,R:0,ph:0,w:0,r:S.r,mu:S.mu});
  const w={L,t:0,bodies,state:'pad',comet:false,result:null,impact:0,orbitAbout};

  place(w,0);

function vel(b,t){const a=b.ph+b.w*t;let vx=-b.R*b.w*Math.sin(a),vy=b.R*b.w*Math.cos(a);if(b.parent){const [qx,qy]=vel(b.parent,t);vx+=qx;vy+=qy;}return [vx,vy];}

let save={stars:{}};try{save=Object.assign(save,JSON.parse(localStorage.getItem('gravity-save')||'{}'));}catch(e){}
function persist(){try{localStorage.setItem('gravity-save',JSON.stringify(save));}catch(e){}}
const sky=(()=>{let s=4;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};return Array.from({length:140},()=>[r()*FW,r()*FH,r()*1.4+.3,r()*6.28]);})();

function buildLevels(){
  const el=$('#levels');el.innerHTML='';
  LEVELS.forEach((L,i)=>{const b=document.createElement('button'),s=save.stars[i]||0;b.className='lv'+(i===li?' cur':'');
    b.innerHTML=`<b>${i+1}</b><small>${'★'.repeat(s)}${'·'.repeat(3-s)}</small>`;b.title=L.name;b.onclick=()=>load(i);el.appendChild(b);});
}
function buildInv(){
  const el=$('#inv');el.innerHTML='';
  LEVELS[li].inv.forEach((r,i)=>{const b=document.createElement('button');b.className='chip'+(i===sel?' sel':'')+(used[i]?' used':'');b.disabled=!!used[i];
    const d=Math.round(10+r*.55);b.innerHTML=`<i style="width:${d}px;height:${d}px;background:${PLACED_COL[i%4]}"></i><span>${i+1}</span>`;b.title=`Planet ${i+1}, radius ${r}`;
    b.onclick=()=>{sel=i;buildInv();};el.appendChild(b);});
}
function nextFree(){const i=used.findIndex((u,k)=>!u&&k>=0);return i;}
function load(i){li=i;placed=[];used=LEVELS[i].inv.map(()=>false);sel=0;$('#lvname').textContent=LEVELS[i].name;reset();buildLevels();buildInv();}
function reset(){world=makeWorld(LEVELS[li],[]);for(const p of placed)p.body=addPlanet(world,p.x,p.y,p.r,0),p.body.slot=p.slot;trail=[];done=false;acc=0;dirty=true;drag=null;$('#ov').hidden=true;$('#bLaunch').textContent='Launch';}
function clearAll(){placed=[];used=used.map(()=>false);sel=0;reset();buildInv();}
function go(){if(world.state==='pad'){launch(world);$('#bLaunch').textContent='Reset';}else reset();}

/* placing: tap empty space drops the selected planet into orbit; tap one of yours to take it back */
function pt(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*FW,(e.clientY-r.top)/r.height*FH];}
const fits=(x,y,r,skip)=>!world.bodies.some(b=>b!==skip&&Math.hypot(b.px-x,b.py-y)<b.r+r+4)&&Math.hypot(world.rocket.x-x,world.rocket.y-y)>=r+8&&x>0&&x<FW&&y>0&&y<FH;
function takeBack(b){world.bodies.splice(world.bodies.indexOf(b),1);used[b.slot]=false;placed=placed.filter(p=>p.body!==b);sel=b.slot;if(touched===b)touched=null;dirty=true;buildInv();}
function moveTo(b,x,y){if(!fits(x,y,b.r,b))return false;movePlanet(world,b,x,y);const p=placed.find(p=>p.body===b);p.x=x;p.y=y;dirty=true;return true;}
cv.addEventListener('pointerdown',e=>{
  if(done)return;
  const [x,y]=pt(e);
  const mine=world.bodies.find(b=>b.type==='placed'&&Math.hypot(b.px-x,b.py-y)<b.r+8);
  if(mine){
    if(world.state==='pad'){drag={b:mine,x0:x,y0:y,dx:mine.px-x,dy:mine.py-y,moved:false};touched=mine;cv.setPointerCapture(e.pointerId);}
    else takeBack(mine);
    return;
  }
  if(used[sel]){const f=nextFree();if(f<0)return;sel=f;}
  const r=LEVELS[li].inv[sel];
  if(!fits(x,y,r)){flash(x,y);return;}
  const b=addPlanet(world,x,y,r);b.slot=sel;used[sel]=true;touched=b;
  if(world.state==='pad')placed.push({x,y,r,slot:sel,body:b});else{placed.push({x:b.px,y:b.py,r,slot:sel,body:b,late:true});preview=null;}
  dirty=true;const f=nextFree();if(f>=0)sel=f;buildInv();
});
cv.addEventListener('pointermove',e=>{if(!drag)return;const [x,y]=pt(e);if(!drag.moved&&Math.hypot(x-drag.x0,y-drag.y0)<4)return;drag.moved=true;moveTo(drag.b,x+drag.dx,y+drag.dy);});
const endDrag=()=>{if(!drag)return;if(!drag.moved)takeBack(drag.b);drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
let bad=null;function flash(x,y){bad={x,y,t:performance.now()/1000};}
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;if(e.repeat&&!e.key.startsWith('Arrow'))return;const k=e.key.toLowerCase();
  const NUDGE={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(NUDGE[k]&&touched&&world.state==='pad'){e.preventDefault();const m=e.shiftKey?5:1;moveTo(touched,touched.px+NUDGE[k][0]*m,touched.py+NUDGE[k][1]*m);return;}
  if(k===' '){e.preventDefault();if(!$('#ov').hidden)reset();else go();}
  else if(k==='r')reset();else if(k==='c')clearAll();
  else if(k>='1'&&k<='4'&&+k<=LEVELS[li].inv.length&&!used[+k-1]){sel=+k-1;buildInv();}});
$('#bLaunch').onclick=go;$('#bClear').onclick=clearAll;
$('#ovRetry').onclick=reset;$('#ovNext').onclick=()=>load(Math.min(LEVELS.length-1,li+1));

function finish(){
  done=true;const w=world,land=w.result==='soft'||w.result==='hard';
  const n=land?1+(w.result==='soft'?1:0)+(w.comet?1:0):0;
  if(n>(save.stars[li]||0)){save.stars[li]=n;persist();buildLevels();}
  const why={soft:'Safe landing!',hard:'Rough landing',crash:'Crashed',lost:'Lost in space'}[w.result];
  $('#ovTitle').textContent=why;
  $('#ovStars').innerHTML=[0,1,2].map(k=>`<span class="${land&&k<n?'on':''}" style="animation-delay:${.15+k*.18}s">★</span>`).join('');
  const goals=[[land,'Reach the green planet'],[w.result==='soft',`Touch down under ${w.L.soft} m/s`+(land?` (${Math.round(w.impact)})`:'')],[land&&w.comet,'Fly through the comet']];
  $('#ovGoals').innerHTML=goals.map(([ok,l])=>`<div class="${ok?'ok':'no'}"><span>${ok?'✓':'✗'}</span><span>${l}</span></div>`).join('');
  $('#ovNext').hidden=!land||li>=LEVELS.length-1;$('#ov').hidden=false;$('#bLaunch').textContent='Retry';
}

/* drawing */
const P=b=>[b.px,b.py];
function warpGrid(){
  const st=32,masses=world.bodies.filter(b=>b.mu>0);
  const pt=(x,y)=>{let dx=0,dy=0;for(const b of masses){const ex=b.px-x,ey=b.py-y,d2=ex*ex+ey*ey,d=Math.sqrt(d2)+1e-3,m=Math.min(.75*d,b.mu*.00012*1/(1+d2/2500)*(b.type==='hole'?1.6:1));dx+=ex/d*m;dy+=ey/d*m;}return [x+dx,y+dy];};
  g.strokeStyle='rgba(120,170,255,.13)';g.lineWidth=1;
  for(let y=0;y<=FH;y+=st){g.beginPath();for(let x=0;x<=FW;x+=8)g.lineTo(...pt(x,y));g.stroke();}
  for(let x=0;x<=FW;x+=st){g.beginPath();for(let y=0;y<=FH;y+=8)g.lineTo(...pt(x,y));g.stroke();}
}
function orbitPath(b){
  if(!b.R||b.type==='star'||b.type==='hole')return;
  const [cx,cy]=b.parent?P(b.parent):[b.cx,b.cy];
  g.strokeStyle=b.type==='placed'?'rgba(177,140,255,.22)':b.type==='dest'?'rgba(120,230,150,.25)':'rgba(200,210,255,.08)';
  g.setLineDash(b.type==='rock'?[]:[4,6]);g.lineWidth=1;g.beginPath();g.arc(cx,cy,b.R,0,7);g.stroke();g.setLineDash([]);
}
function ball(x,y,r,c1,c2,glow){
  if(glow){const gg=g.createRadialGradient(x,y,r*.6,x,y,r*2.2);gg.addColorStop(0,glow);gg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gg;g.beginPath();g.arc(x,y,r*2.2,0,7);g.fill();}
  const gr=g.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
}
function drawBody(b,t){
  const [x,y]=P(b),r=b.r;
  switch(b.type){
    case 'star':ball(x,y,r,'#fff8d8','#f4b73c','rgba(255,200,90,.45)');break;
    case 'hole':{const gg=g.createRadialGradient(x,y,r,x,y,r*3.2);gg.addColorStop(0,'rgba(255,150,60,.55)');gg.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=gg;g.beginPath();g.arc(x,y,r*3.2,0,7);g.fill();
      g.strokeStyle='rgba(255,190,110,.8)';g.lineWidth=2.5;g.beginPath();g.ellipse(x,y,r*2.1,r*.7,(reduce?0:t*.3)%6.28,0,7);g.stroke();g.fillStyle='#000';g.beginPath();g.arc(x,y,r,0,7);g.fill();break;}
    case 'start':ball(x,y,r,'#8fd0ff','#2b5f9e');g.fillStyle='#e6edf5';g.fillRect(x-3,y-r-5,6,6);break;
    case 'dest':{ball(x,y,r,'#a8f0a0','#2f8a4a','rgba(120,230,140,.25)');const k=reduce?.5:(t*1.2)%1;g.strokeStyle=`rgba(140,240,160,${.6*(1-k)})`;g.lineWidth=2;g.beginPath();g.arc(x,y,r+4+k*14,0,7);g.stroke();
      g.strokeStyle='#e6edf5';g.lineWidth=1.5;g.beginPath();g.moveTo(x,y-r);g.lineTo(x,y-r-14);g.stroke();g.fillStyle='#f2c94c';g.beginPath();g.moveTo(x,y-r-14);g.lineTo(x+9,y-r-11);g.lineTo(x,y-r-8);g.fill();break;}
    case 'lava':ball(x,y,r,'#ffcf7a','#c3381f','rgba(255,90,40,.35)');break;
    case 'rock':ball(x,y,r,'#a7a3b8','#4c4960');g.fillStyle='rgba(30,28,40,.35)';g.beginPath();g.arc(x+r*.3,y+r*.1,r*.25,0,7);g.arc(x-r*.3,y-r*.25,r*.18,0,7);g.fill();break;
    case 'placed':{const c=PLACED_COL[b.slot%4];ball(x,y,r,'#ffffff',c,c+'55');break;}
  }
}
function drawRocket(R,t,live){
  const a=Math.atan2(R.vy,R.vx);g.save();g.translate(R.x,R.y);g.rotate(a);
  if(live&&!reduce){const f=6+Math.sin(t*50)*2;g.fillStyle='#ffb347';g.beginPath();g.moveTo(-5,-2.5);g.lineTo(-5-f,0);g.lineTo(-5,2.5);g.fill();}
  g.fillStyle='#f3f5fa';g.beginPath();g.moveTo(8,0);g.lineTo(-5,-4.5);g.lineTo(-3,0);g.lineTo(-5,4.5);g.closePath();g.fill();
  g.fillStyle='#ff6b5a';g.beginPath();g.arc(1.5,0,1.6,0,7);g.fill();g.restore();
}
function label(t,x,y,size=18,col='#e9ecf8'){g.font=`600 ${size}px Fredoka, system-ui, sans-serif`;g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='rgba(8,8,24,.8)';g.strokeText(t,x,y);g.fillStyle=col;g.fillText(t,x,y);}
function render(now){
  const t=now/1000,w=world;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='#0b0b1e';g.fillRect(0,0,FW,FH);
  for(const [x,y,r,p] of sky){g.globalAlpha=reduce?.6:.35+.35*Math.sin(t*1.3+p);g.fillStyle='#dfe6ff';g.fillRect(x,y,r,r);}g.globalAlpha=1;
  warpGrid();
  for(const b of w.bodies)orbitPath(b);
  const c=w.L.comet;if(!w.comet){const k=reduce?0:Math.sin(t*3)*.15;g.save();g.translate(...c);g.rotate(-.5);g.fillStyle='rgba(150,230,255,.25)';g.beginPath();g.ellipse(-14,0,16,4,0,0,7);g.fill();g.restore();ball(c[0],c[1],6*(1+k),'#ffffff','#7fd8ff','rgba(127,216,255,.5)');}
  if(preview&&preview.pts.length>1){const pts=preview.pts,live=w.state==='pad';g.lineWidth=2;
    for(let i=1;i<pts.length;i+=2){const a=live?.85*(1-.55*i/pts.length):.25;g.strokeStyle=`rgba(255,255,255,${a})`;g.beginPath();g.moveTo(...pts[i-1]);g.lineTo(...pts[i]);g.stroke();}
    if(live&&preview.result){const e=pts[pts.length-1],ok=preview.result==='soft'||preview.result==='hard';g.strokeStyle=ok?'#8fe3a0':'#ff7d6e';g.lineWidth=2.5;g.beginPath();
      if(ok)g.arc(e[0],e[1],9,0,7);else{g.moveTo(e[0]-7,e[1]-7);g.lineTo(e[0]+7,e[1]+7);g.moveTo(e[0]+7,e[1]-7);g.lineTo(e[0]-7,e[1]+7);}g.stroke();}}
  for(const b of w.bodies)drawBody(b,t);
  if(touched&&w.state==='pad'&&w.bodies.includes(touched)){g.strokeStyle='rgba(242,201,76,.8)';g.setLineDash([3,4]);g.lineWidth=1.5;g.beginPath();g.arc(touched.px,touched.py,touched.r+6,0,7);g.stroke();g.setLineDash([]);}
  if(trail.length>1){for(let i=1;i<trail.length;i++){g.strokeStyle=`rgba(255,200,140,${i/trail.length*.7})`;g.lineWidth=2;g.beginPath();g.moveTo(...trail[i-1]);g.lineTo(...trail[i]);g.stroke();}}
  if(w.state==='pad'){const a=w.L.launch.ang*Math.PI/180,R=w.rocket;g.strokeStyle='rgba(255,255,255,.6)';g.setLineDash([5,5]);g.lineWidth=1.5;g.beginPath();g.moveTo(R.x,R.y);g.lineTo(R.x+Math.cos(a)*50,R.y+Math.sin(a)*50);g.stroke();g.setLineDash([]);}
  if(w.result!=='crash'&&w.result!=='lost'||!done)drawRocket(w.rocket,t,w.state==='fly');
  else{const R=w.rocket,k=Math.min(1,(t-(shown||t))*2);g.fillStyle=`rgba(255,160,80,${1-k})`;g.beginPath();g.arc(R.x,R.y,6+18*k,0,7);g.fill();}
  if(bad&&t-bad.t<.4){g.strokeStyle=`rgba(255,110,110,${1-(t-bad.t)/.4})`;g.lineWidth=2;g.beginPath();g.arc(bad.x,bad.y,14,0,7);g.moveTo(bad.x-8,bad.y-8);g.lineTo(bad.x+8,bad.y+8);g.stroke();}
  if(w.state==='pad'&&placed.length===0)label('Tap to drop a planet. Drag it to fine-tune, then Launch.',FW/2,26,17);
  if(w.state==='fly')label(`${w.ft.toFixed(1)} s`,FW-40,22,15,'#9aa3c7');
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(world.state==='fly'){acc+=dt;while(acc>=DT&&world.state==='fly'){step(world,DT);acc-=DT;}
    const R=world.rocket,lt=trail[trail.length-1];if(!lt||Math.hypot(lt[0]-R.x,lt[1]-R.y)>4){trail.push([R.x,R.y]);if(trail.length>160)trail.shift();}}
  if(world.state==='pad'&&dirty){preview=predict(world,LEVELS[li].preview);dirty=false;}
  if(world.state==='done'&&!done){shown=now/1000;finish();}
  render(now);requestAnimationFrame(frame);
}
load(0);requestAnimationFrame(frame);
</script>
</body>
</html>
